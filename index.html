<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<title>Flashcards — ICMAT Prova Substituta</title>
<style>
  :root{
    --ground:#15171c; --ground-2:#0e1014;
    --surface:#1c1f27; --surface-2:#232734;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.06);
    --ink:#edf0f5; --muted:#95a0b1; --faint:#6b7585;
    --heat:#ff7a33; --heat-soft:rgba(255,122,51,.14);
    --steel:#6fb0e0; --steel-soft:rgba(111,176,224,.13);
    --good:#5fd694; --good-soft:rgba(95,214,148,.15);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,122,51,.10), transparent 55%),
      radial-gradient(90% 70% at 90% 110%, rgba(111,176,224,.07), transparent 60%),
      var(--ground);
    display:flex; flex-direction:column; min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:660px; margin:0 auto; padding:0 18px}

  /* ---- header ---- */
  header{padding-top:22px; padding-bottom:14px}
  .brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .eb{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint)}
  .brand h1{margin:0; font-size:19px; font-weight:650; letter-spacing:-.01em}
  .brand h1 span{color:var(--muted); font-weight:500}
  .chips{display:flex; gap:7px; margin-top:16px; flex-wrap:wrap}
  .chips+.chips{margin-top:8px}
  .chip{
    font-family:var(--mono); font-size:12px; letter-spacing:.04em;
    color:var(--muted); background:var(--surface); border:1px solid var(--line);
    padding:7px 13px; border-radius:999px; cursor:pointer; transition:.16s;
  }
  .chip:hover{border-color:rgba(255,255,255,.22); color:var(--ink)}
  .chip[aria-pressed="true"]{background:#fff; color:#15171c; border-color:#fff; font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--steel-soft); color:var(--steel); border-color:rgba(111,176,224,.4)}

  .meter{display:flex; align-items:center; gap:12px; margin-top:16px}
  .bar{flex:1; height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden}
  .bar>i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--heat),#ffb37a); border-radius:99px; transition:width .3s ease}
  .count{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
  .count b{color:var(--ink); font-weight:600}
  .dom{font-family:var(--mono); font-size:11.5px; color:var(--good); white-space:nowrap}

  /* ---- stage ---- */
  main{flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:12px 0 6px}
  .stage{width:100%; max-width:660px; padding:0 18px; perspective:1600px}
  .card{position:relative; cursor:pointer; outline:none}
  .card:focus-visible .inner{box-shadow:0 0 0 2px var(--heat), 0 24px 60px -28px rgba(0,0,0,.7)}
  .inner{
    display:grid; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.7,.2,1);
    min-height:340px; border-radius:20px;
    box-shadow:0 24px 60px -30px rgba(0,0,0,.75);
  }
  .card.flip .inner{transform:rotateY(180deg)}
  .face{
    grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border:1px solid var(--line); border-radius:20px; padding:26px 26px 24px;
    display:flex; flex-direction:column; gap:16px; overflow-wrap:anywhere;
  }
  .face::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; border-radius:20px 20px 0 0;
    background:var(--accent,var(--heat)); opacity:.9}
  .back{transform:rotateY(180deg)}
  .card.c .face{--accent:var(--steel)}
  .card.q .face{--accent:var(--heat)}

  .tag{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .tag .lbl{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent,var(--heat)); font-weight:600}
  .tag .side{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}

  .term{font-size:26px; line-height:1.18; font-weight:650; letter-spacing:-.015em; text-wrap:balance; margin:auto 0}
  .stem{font-size:16.5px; line-height:1.5; white-space:pre-line; font-weight:450}
  .opts{list-style:none; margin:2px 0 0; padding:0; display:flex; flex-direction:column; gap:7px}
  .opts li{display:flex; gap:10px; align-items:flex-start; font-size:14.5px; line-height:1.42; color:var(--muted)}
  .opts .k{font-family:var(--mono); font-size:12.5px; color:var(--faint); padding-top:1px; min-width:16px}

  .answer{font-size:17px; line-height:1.5; margin:auto 0; font-weight:450}
  .answer strong{color:var(--ink); font-weight:650}
  .gab{display:flex; align-items:center; gap:12px}
  .gab .letter{font-family:var(--mono); font-weight:700; font-size:22px; color:var(--good);
    background:var(--good-soft); border:1px solid rgba(95,214,148,.35); border-radius:12px;
    width:46px; height:46px; display:grid; place-items:center; flex:none}
  .gab .txt{font-size:15.5px; line-height:1.4; font-weight:550}
  .explain{font-size:15px; line-height:1.55; color:var(--muted)}
  .explain b{color:var(--ink); font-weight:600}
  .hint{margin-top:auto; font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--faint); display:flex; align-items:center; gap:6px}
  .knownmark{position:absolute; top:16px; right:18px; font-size:12px; color:var(--good); font-family:var(--mono); letter-spacing:.1em; opacity:0; transition:.2s}
  .card.known .knownmark{opacity:1}

  .empty{width:100%; max-width:660px; text-align:center; padding:40px 24px; color:var(--muted)}
  .empty .big{font-size:40px; margin-bottom:12px}

  /* ---- controls ---- */
  footer{padding:14px 0 max(18px,env(safe-area-inset-bottom))}
  .nav{display:flex; align-items:center; gap:10px}
  button{font-family:var(--sans); cursor:pointer; border:1px solid var(--line); color:var(--ink);
    background:var(--surface); border-radius:13px; transition:.15s; font-size:14px}
  button:hover{border-color:rgba(255,255,255,.25)}
  button:focus-visible{outline:2px solid var(--heat); outline-offset:2px}
  button:active{transform:translateY(1px)}
  .arrow{width:52px; height:52px; font-size:20px; display:grid; place-items:center; flex:none; color:var(--muted)}
  .flipbtn{flex:1; height:52px; font-weight:650; font-size:15.5px; letter-spacing:.01em;
    background:var(--heat); color:#1a0f06; border-color:var(--heat)}
  .flipbtn:hover{background:#ff8c4d; border-color:#ff8c4d}
  .sub{display:flex; gap:9px; margin-top:11px; flex-wrap:wrap; justify-content:center}
  .sub button{padding:9px 15px; font-size:13px; color:var(--muted); font-family:var(--mono); letter-spacing:.03em}
  .sub button:hover{color:var(--ink)}
  .sub button.on{background:var(--good-soft); border-color:rgba(95,214,148,.4); color:var(--good)}
  .kbd{font-family:var(--mono); font-size:11px; color:var(--faint); text-align:center; margin-top:12px; letter-spacing:.03em}
  .kbd b{color:var(--muted); font-weight:500}

  @media (max-width:520px){
    .term{font-size:23px}
    .arrow{width:46px;height:50px}
    .kbd{display:none}
    .inner{min-height:320px}
  }
  @media (prefers-reduced-motion:reduce){
    .inner{transition:none}
    .bar>i{transition:none}
  }
</style>

<header>
  <div class="wrap">
    <div class="brand">
      <span class="eb">ICMAT · Prova Substituta · 13/07 · 19h</span>
    </div>
    <div class="brand" style="margin-top:4px">
      <h1>Ciência dos Materiais <span>— semestre completo</span></h1>
    </div>
    <div class="chips" role="group" aria-label="Filtrar por tipo">
      <button class="chip" data-deck="all" aria-pressed="true">Tudo</button>
      <button class="chip ghost" data-deck="c" aria-pressed="false">Conceitos</button>
      <button class="chip" data-deck="q" aria-pressed="false">Questões</button>
    </div>
    <div class="chips" role="group" aria-label="Filtrar por bloco de prova">
      <button class="chip" data-pdeck="all" aria-pressed="true">Semestre</button>
      <button class="chip" data-pdeck="1" aria-pressed="false">P1 · cristais/prop. mec.</button>
      <button class="chip" data-pdeck="2" aria-pressed="false">P2 · discord./fases</button>
      <button class="chip" data-pdeck="3" aria-pressed="false">P3 · trat. térm./ligas</button>
    </div>
    <div class="meter">
      <span class="count">carta <b id="pos">1</b> / <span id="total">97</span></span>
      <div class="bar"><i id="progfill"></i></div>
      <span class="dom" id="dom">dominadas 0/97</span>
    </div>
  </div>
</header>

<main>
  <div class="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard — toque para virar">
      <span class="knownmark">✓ dominada</span>
      <div class="inner">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <div class="empty" id="empty" hidden>
      <div class="big">✓</div>
      <div>Você dominou tudo neste filtro.<br>Troque o filtro ou reinicie para revisar de novo.</div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="nav">
      <button class="arrow" id="prev" aria-label="Anterior">‹</button>
      <button class="flipbtn" id="flip">Virar carta</button>
      <button class="arrow" id="next" aria-label="Próxima">›</button>
    </div>
    <div class="sub">
      <button id="know">Marcar “sei”</button>
      <button id="hide">Esconder dominadas</button>
      <button id="shuffle">Embaralhar</button>
      <button id="reset">Reiniciar</button>
    </div>
    <div class="kbd"><b>←/→</b> navegar · <b>espaço</b> virar · <b>K</b> sei · <b>S</b> embaralhar</div>
  </div>
</footer>

<script>
const CARDS = [
  // ================= BLOCO P1 — ESTRUTURA CRISTALINA, DEFEITOS/DIFUSÃO, PROP. MECÂNICAS =================
  // ---------- CONCEITOS P1 ----------
  {t:"c", p:1, term:"Célula unitária — o que é?",
   ans:"É a <strong>menor unidade repetitiva</strong> da estrutura tridimensional, escolhida para representar a <strong>simetria</strong> da estrutura cristalina (átomos como esferas rígidas). Materiais <strong>amorfos</strong> não têm ordem de longo alcance."},
  {t:"c", p:1, term:"Tabela do sistema cúbico: átomos · coordenação · empacotamento",
   ans:"<strong>CS:</strong> 1 átomo · NC 6 · FEA <strong>0,52</strong> (por isso metais não cristalizam em CS)\n<strong>CCC:</strong> 2 átomos · NC 8 · FEA <strong>0,68</strong>\n<strong>CFC:</strong> 4 átomos · NC 12 · FEA <strong>0,74</strong>"},
  {t:"c", p:1, term:"Parâmetro de rede × raio atômico (a ↔ R)",
   ans:"<strong>CS:</strong> a = 2R (tocam na aresta)\n<strong>CCC:</strong> a = 4R/√3 — tocam na <strong>diagonal do cubo</strong>\n<strong>CFC:</strong> a = 2R√2 = 4R/√2 — tocam na <strong>diagonal da face</strong>"},
  {t:"c", p:1, term:"Estrutura CCC — características e exemplos",
   ans:"<strong>2 átomos</strong>/célula, NC <strong>8</strong>, FEA <strong>0,68</strong>. Átomos se tocam na diagonal do cubo → direção compacta <strong>&lt;111&gt;</strong>, plano mais denso <strong>{110}</strong>. Cristalizam em CCC: <strong>Fe α, Cr, W</strong>."},
  {t:"c", p:1, term:"Estrutura CFC — características e exemplos",
   ans:"<strong>4 átomos</strong>/célula, NC <strong>12</strong>, FEA <strong>0,74</strong>. É o sistema <strong>mais comum</strong> nos metais: <strong>Al, Cu, Pb, Ag, Ni, Fe γ</strong>. Direção compacta <strong>&lt;110&gt;</strong> (diagonal da face), plano mais denso <strong>{111}</strong>."},
  {t:"c", p:1, term:"Estrutura HC — características e exemplos",
   ans:"NC <strong>12</strong> e FEA <strong>0,74</strong> (mesmos da CFC). Exemplos: <strong>Mg, Zn, Ti α</strong>. Tem <strong>poucos sistemas de escorregamento</strong> (3–6) → metais HC tendem a ser <strong>frágeis</strong>."},
  {t:"c", p:1, term:"Polimorfismo / alotropia",
   ans:"O material pode ter <strong>mais de uma estrutura cristalina</strong> conforme temperatura e pressão. Muda <strong>densidade</strong> e outras propriedades. Exemplos: <strong>Fe, Ti, C</strong> (grafite/diamante), SiC."},
  {t:"c", p:1, term:"Alotropia do ferro — sequência com a temperatura",
   ans:"<strong>Fe α (CCC)</strong> até ~912 °C → <strong>Fe γ (CFC)</strong> de 912 a 1394 °C → <strong>Fe δ (CCC)</strong> de 1394 °C até fundir (1538 °C). Decorar: <strong>CCC → CFC → CCC</strong>."},
  {t:"c", p:1, term:"Alotropia do titânio",
   ans:"<strong>Fase α:</strong> até 883 °C, estrutura <strong>HC</strong>, é <strong>mole</strong>. <strong>Fase β:</strong> acima de 883 °C, estrutura <strong>CCC</strong>, é <strong>dura</strong>."},
  {t:"c", p:1, term:"Densidade a partir da estrutura cristalina",
   ans:"<strong>ρ = nA / (V<sub>C</sub>·N<sub>A</sub>)</strong>\nn = átomos por célula · A = peso atômico · V<sub>C</sub> = volume da célula · N<sub>A</sub> = 6,02×10²³ átomos/mol."},
  {t:"c", p:1, term:"Notação: direções e planos cristalográficos",
   ans:"Direção: <strong>[uvw]</strong>; família de direções: <strong>&lt;uvw&gt;</strong>. Plano (índices de <strong>Miller</strong>, recíprocos das interseções): <strong>(hkl)</strong>; família de planos: <strong>{hkl}</strong>. Índice negativo = <strong>barra</strong> sobre o número; reduzir a inteiros mínimos."},
  {t:"c", p:1, term:"Onde ocorre o deslizamento (deformação plástica)?",
   ans:"Nos <strong>planos mais densamente empacotados</strong> e, dentro deles, nas <strong>direções de maior densidade atômica</strong>.\n<strong>CFC:</strong> {111}&lt;110&gt; · <strong>CCC:</strong> {110}&lt;111&gt;"},
  {t:"c", p:1, term:"Defeitos cristalinos — classificação por dimensão",
   ans:"<strong>Pontuais (0D):</strong> lacunas, intersticiais, substitucionais.\n<strong>Lineares (1D):</strong> discordâncias.\n<strong>Planares (2D):</strong> contornos de grão, contornos de macla, superfícies."},
  {t:"c", p:1, term:"Difusão — o que é e o que ela exige?",
   ans:"Transporte de matéria por <strong>migração dos átomos</strong> na rede. Exige: <strong>sítio adjacente vazio</strong> + <strong>energia</strong> (vibracional) para quebrar ligações. A difusão <strong>aumenta com a temperatura</strong>."},
  {t:"c", p:1, term:"Difusão por lacuna × difusão intersticial",
   ans:"<strong>Por lacuna:</strong> autodifusão (metal puro) e interdifusão. <strong>Intersticial:</strong> átomos pequenos (<strong>H, C, N, O</strong>) — é <strong>mais rápida</strong> que por lacuna. A <strong>cementação</strong> é difusão intersticial de C no aço."},
  {t:"c", p:1, term:"Tensão e deformação de engenharia",
   ans:"<strong>σ = F/A₀</strong> (MPa) — força sobre a área <strong>inicial</strong>.\n<strong>ε = Δl/l₀</strong> — adimensional (ou %). Determinadas no <strong>ensaio de tração</strong>, o mais comum dos ensaios."},
  {t:"c", p:1, term:"Lei de Hooke e módulo de elasticidade (E)",
   ans:"Na região elástica (reversível): <strong>σ = E·ε</strong>. E = <strong>rigidez</strong> do material, ligado às <strong>forças de ligação interatômicas</strong>. Aumento de temperatura ⇒ <strong>diminui</strong> E, σe e LRT, e <strong>aumenta</strong> a ductilidade."},
  {t:"c", p:1, term:"Coeficiente de Poisson (ν)",
   ans:"Razão <strong>negativa</strong> entre a deformação <strong>lateral</strong> e a <strong>axial</strong>: ν = −εx/εz. Metais: <strong>0,25 a 0,35</strong>. Valor máximo: <strong>0,5</strong> (sem variação de volume)."},
  {t:"c", p:1, term:"Limite de escoamento (σe) — como se determina?",
   ans:"Marca o início da <strong>deformação plástica</strong>. Convenção: reta <strong>paralela à porção elástica</strong> partindo de deformação <strong>0,2%</strong> (0,002); a interseção com a curva é o σe. Aços baixo C mostram escoamento nítido (bandas de Lüders)."},
  {t:"c", p:1, term:"LRT e tensão/deformação verdadeiras",
   ans:"<strong>LRT</strong> = tensão máxima da curva (ponto M, onde começa o <strong>pescoço</strong>).\nVerdadeiras: <strong>σv = F/Ai = σ(1+ε)</strong> e <strong>εv = ln(1+ε)</strong> — válidas <strong>até a formação do pescoço</strong>."},
  {t:"c", p:1, term:"Ductilidade — como medir? Quando é frágil?",
   ans:"Grau de deformação plástica até a fratura: <strong>AL% = (lf−l₀)/l₀×100</strong> ou <strong>RA% = (A₀−Af)/A₀×100</strong>. Frágil ≈ deformação de fratura <strong>&lt; 5%</strong>."},
  {t:"c", p:1, term:"Resiliência × Tenacidade",
   ans:"<strong>Resiliência:</strong> energia <strong>elástica</strong> absorvida e devolvida — <strong>Ur = σe²/2E</strong>. Molas: <strong>alto σe + baixo E</strong>.\n<strong>Tenacidade:</strong> energia total absorvida <strong>até a ruptura</strong> (área sob a curva σ×ε) — exige resistência <strong>e</strong> ductilidade."},
  {t:"c", p:1, term:"Dureza — definição e por que o ensaio é tão usado",
   ans:"Resistência à <strong>deformação plástica localizada</strong> (penetração/risco). Ensaios <strong>simples, baratos, quase não destrutivos</strong> e permitem <strong>estimar o LRT</strong> (≈ proporcional a HB). ⚠️ Não é grandeza absoluta: depende da técnica — não comparar escalas diferentes."},
  {t:"c", p:1, term:"Dureza Brinell (HB)",
   ans:"Esfera comprimida na superfície (padrão: <strong>10 mm, 3000 kgf, 15 s</strong>); HB = carga / <strong>área da calota</strong> impressa. Mantém-se o <strong>fator de carga F/D²</strong> pra variar esfera/carga. Esfera de aço mede até <strong>~500 HB</strong> (acima: esfera de <strong>WC</strong>)."},
  {t:"c", p:1, term:"Dureza Rockwell (HR)",
   ans:"<strong>Pré-carga</strong> (10 kgf; superficial: 3 kgf) + carga principal; mede <strong>diferença de profundidade</strong> — leitura <strong>direta na máquina</strong>. <strong>HRB:</strong> esfera de aço 1,588 mm / 100 kgf (metais dúcteis). <strong>HRC:</strong> cone de diamante / 150 kgf (materiais duros)."},
  {t:"c", p:1, term:"Dureza Vickers (HV)",
   ans:"<strong>Pirâmide de diamante</strong>; HV = 1,8544·F/d². Impressões geometricamente similares ⇒ <strong>qualquer carga</strong> dá o mesmo valor; <strong>escala contínua</strong>, ideal para <strong>microdureza</strong>, peças finas e camadas superficiais."},
  {t:"c", p:1, term:"Ensaio de impacto (Charpy / Izod)",
   ans:"Um <strong>pêndulo</strong> rompe um corpo de prova <strong>entalhado</strong> (entalhe em V); a energia absorvida = diferença de energia potencial (h₀−h₁). Avalia a <strong>tenacidade ao impacto</strong> e previne fratura frágil em serviço."},
  {t:"c", p:1, term:"Transição dúctil-frágil — quem apresenta?",
   ans:"Metais <strong>CCC</strong> apresentam transição nítida com a queda da temperatura. <strong>CFC</strong> (Cu, Al, inox austenítico) e <strong>HC</strong> não apresentam. Favorecem fratura frágil: <strong>entalhe/trinca, alta velocidade de carga, baixa temperatura</strong>."},
  {t:"c", p:1, term:"Fratura dúctil × fratura frágil",
   ans:"<strong>Dúctil:</strong> extensa deformação plástica, propagação <strong>lenta</strong>, taça-cone a 45°, típica de <strong>CFC</strong>.\n<strong>Frágil:</strong> por <strong>clivagem</strong>, rápida, perpendicular à tensão, quase sem deformação — <strong>CCC e HC</strong>. <strong>Transgranular</strong> = através do grão; <strong>intergranular</strong> = pelo contorno."},

  // ---------- QUESTÕES P1 ----------
  {t:"q", p:1, n:1, stem:"Sobre a estrutura cúbica de face centrada (CFC), assinale a alternativa INCORRETA:",
   opts:[["A","possui 4 átomos por célula unitária"],["B","o número de coordenação é 12"],["C","o fator de empacotamento é 0,74"],["D","os átomos se tocam ao longo da diagonal do cubo"],["E","Al, Cu e Ni cristalizam em CFC"]],
   a:"D", at:"átomos se tocam na diagonal do CUBO (INCORRETA)",

  {t:"q", p:1, n:2, stem:"Sobre a alotropia do ferro (V/F):\nI. À temperatura ambiente o ferro é CCC (ferrita α)\nII. Entre ~912 °C e 1394 °C o ferro é CFC (austenita γ)\nIII. As transformações polimórficas não alteram a densidade\nIV. Acima de 1394 °C o ferro volta a ser CCC (fase δ)",

  // ================= BLOCO P2 — DISCORDÂNCIAS/AUMENTO DE RESISTÊNCIA, DIAGRAMAS E TRANSFORMAÇÕES DE FASE =================
  // ---------- CONCEITOS P2 ----------
  {t:"c", p:2, term:"Discordância — que tipo de defeito é?",
   ans:"Defeito <strong>LINEAR (unidimensional)</strong> — pegadinha clássica: <strong>não é pontual</strong>. É a responsável pela deformação plástica: os metais são ~<strong>10× mais moles</strong> do que seriam sem elas."},
  {t:"c", p:2, term:"Discordância em aresta × hélice × mista",
   ans:"<strong>Aresta (cunha/linha):</strong> semiplano extra de átomos; vetor de Burgers <strong>⊥</strong> à linha; zonas de tração e compressão.\n<strong>Hélice (espiral):</strong> distorção por cisalhamento; b <strong>∥</strong> à linha.\n<strong>Mista:</strong> a mais comum nos materiais reais."},
  {t:"c", p:2, term:"Vetor de Burgers (b)",
   ans:"Expressa a <strong>magnitude e a direção</strong> da distorção da rede cristalina associada à discordância — a distância de deslocamento dos átomos ao redor dela."},
  {t:"c", p:2, term:"Sistema de escorregamento",
   ans:"Combinação do <strong>plano</strong> mais denso com a <strong>direção</strong> mais densa nele.\n<strong>CFC:</strong> {111}&lt;110&gt; — 12 sistemas (dúctil)\n<strong>CCC:</strong> {110}&lt;111&gt; — 12 sistemas (alguns só a alta T)\n<strong>HC:</strong> 3–6 sistemas → <strong>frágil</strong>"},
  {t:"c", p:2, term:"Deformação plástica em policristais",
   ans:"A direção de escorregamento <strong>varia de grão para grão</strong>; na maioria dos grãos operam <strong>~2 sistemas</strong>. Um grão bem orientado só desliza quando os vizinhos também podem → policristal exige <strong>mais tensão</strong> que monocristal."},
  {t:"c", p:2, term:"Densidade de discordâncias — valores típicos",
   ans:"Solidificação lenta: <strong>10³</strong> disc./mm² · Deformado a frio: <strong>10⁹–10¹⁰</strong> · Deformado + tratado termicamente: <strong>10⁵–10⁶</strong>."},
  {t:"c", p:2, term:"Maclas — o que são e quando aparecem?",
   ans:"Contorno com <strong>simetria de espelho</strong> da rede. <strong>Maclas de deformação:</strong> CCC e HC, baixa T e alta taxa de carga (impacto). <strong>Maclas de recozimento:</strong> típicas de <strong>CFC</strong>. Bloqueiam o escorregamento com eficácia."},
  {t:"c", p:2, term:"Princípio geral do aumento de resistência",
   ans:"<strong>Impedir/dificultar o movimento das discordâncias.</strong> Mecanismos: <strong>1)</strong> solução sólida (elemento de liga), <strong>2)</strong> redução do tamanho de grão, <strong>3)</strong> encruamento, <strong>4)</strong> tratamento térmico (transformação de fase)."},
  {t:"c", p:2, term:"Endurecimento por solução sólida",
   ans:"Átomos de soluto <strong>distorcem a rede</strong> (menores → tração; maiores → compressão) e se alojam perto das discordâncias, <strong>ancorando-as</strong>. Por isso <strong>ligas são sempre mais resistentes que os metais puros</strong>."},
  {t:"c", p:2, term:"Refino de grão e equação de Hall-Petch",
   ans:"O contorno de grão é <strong>barreira</strong> ao movimento das discordâncias (muda a orientação cristalina). <strong>σe = σ₀ + Ke·d^(−1/2)</strong>: grão menor ⇒ maior limite de escoamento. É o mecanismo que aumenta resistência <strong>e também a tenacidade</strong>. Contornos de <strong>baixo ângulo</strong> (&lt;15°) são pouco eficazes."},
  {t:"c", p:2, term:"Encruamento (endurecimento por deformação a frio)",
   ans:"A deformação <strong>multiplica as discordâncias</strong>; as interações entre elas (repulsivas) travam o movimento ⇒ <strong>↑ resistência e limite de escoamento, ↓ ductilidade</strong>. É removido por tratamento térmico (<strong>recozimento/recristalização</strong>)."},
  {t:"c", p:2, term:"Recozimento do encruado: recuperação → recristalização → crescimento de grão",
   ans:"<strong>Recuperação:</strong> alívio de tensões; propriedades <strong>físicas</strong> (condutividade) voltam.\n<strong>Recristalização:</strong> grãos novos <strong>equiaxiais e livres de deformação</strong>; propriedades mecânicas voltam; força motriz = energia armazenada na deformação.\n<strong>Crescimento de grão:</strong> grandes comem os pequenos (força motriz = ↓ energia de contorno); grão maior ⇒ material mais <strong>mole</strong>."},
  {t:"c", p:2, term:"Temperatura de recristalização",
   ans:"Temperatura na qual a recristalização se completa em <strong>1 hora</strong>. Fica entre <strong>1/3 e 1/2 da temperatura de fusão</strong> do metal."},
  {t:"c", p:2, term:"Fase — definição",
   ans:"Porção <strong>homogênea</strong> do material com propriedades físicas e/ou químicas uniformes. Água + gelo = <strong>2 fases</strong> (mesma química, física distinta). Polimorfos são fases diferentes: Fe α (CCC) ≠ Fe γ (CFC)."},
  {t:"c", p:2, term:"Limite de solubilidade e soluções sólidas",
   ans:"<strong>Limite de solubilidade:</strong> concentração máxima de soluto que forma uma única fase.\nSolução sólida <strong>substitucional</strong> (soluto no lugar do solvente) × <strong>intersticial</strong> (soluto nos interstícios — ex.: C no Fe)."},
  {t:"c", p:2, term:"Linhas do diagrama: liquidus, solidus, solvus",
   ans:"<strong>Liquidus:</strong> acima dela, só líquido. <strong>Solidus:</strong> abaixo dela, só sólido. <strong>Solvus:</strong> limite de solubilidade entre fases <strong>sólidas</strong> (separa α de α+β). Nas regiões bifásicas usa-se a <strong>linha de amarração</strong>."},
  {t:"c", p:2, term:"Regra da alavanca",
   ans:"Fração de uma fase = <strong>braço OPOSTO</strong> ÷ comprimento total da linha de amarração:\n<strong>W_L = (Cs − C₀)/(Cs − C_L)</strong> · <strong>W_S = (C₀ − C_L)/(Cs − C_L)</strong>\n⚠️ Usar sempre o braço do lado <strong>contrário</strong> à fase calculada."},
  {t:"c", p:2, term:"Reação eutética × eutetóide",
   ans:"<strong>Eutética:</strong> L → α + β (isotérmica; produto em <strong>lamelas</strong>).\n<strong>Eutetóide:</strong> <strong>sólido</strong> → 2 sólidos (γ → α + Fe₃C).\nRegra: “-óide” = <strong>sem líquido</strong>. Ambas são reações <strong>invariantes</strong> (zero grau de liberdade)."},
  {t:"c", p:2, term:"Fases do sistema Fe-C",
   ans:"<strong>Ferrita α:</strong> CCC, dissolve no máx <strong>0,022%C</strong>, mole e dúctil.\n<strong>Austenita γ:</strong> CFC, dissolve até <strong>2,14%C</strong> (a 1147 °C), estável só acima de 727 °C.\n<strong>Cementita Fe₃C:</strong> <strong>6,7%C</strong>, muito <strong>dura e frágil</strong>, metaestável.\n<strong>Ferrita δ:</strong> CCC de alta temperatura."},
  {t:"c", p:2, term:"Aço × ferro fundido — faixas de carbono",
   ans:"<strong>Aço:</strong> 0,008 a <strong>2,14%p C</strong>.\n<strong>Ferro fundido:</strong> 2,14 a <strong>6,7%p C</strong> (na prática &lt; 4,5%)."},
  {t:"c", p:2, term:"Eutetóide do aço e perlita",
   ans:"Em <strong>0,76%C e 727 °C</strong>: γ → α + Fe₃C. O produto é a <strong>perlita</strong>: lamelas alternadas de <strong>ferrita</strong> (claras, grossas) e <strong>cementita</strong> (escuras, finas), em “colônias”."},
  {t:"c", p:2, term:"Aço hipoeutetóide × hipereutetóide",
   ans:"<strong>Hipo (&lt;0,76%C):</strong> ferrita <strong>proeutetóide</strong> (formada acima de 727 °C) + perlita.\n<strong>Hiper (0,76–2,14%C):</strong> rede de <strong>cementita proeutetóide</strong> nos contornos de grão da austenita + perlita."},
  {t:"c", p:2, term:"Por que a austenita dissolve mais carbono que a ferrita?",
   ans:"A γ é <strong>CFC</strong>, com interstícios maiores que os da CCC. O carbono ocupa posições <strong>INTERSTICIAIS</strong> — dizer que ocupa posições “substitucionais” é pegadinha de prova."},
  {t:"c", p:2, term:"Curvas TTT — produtos da decomposição da austenita",
   ans:"<strong>Perlita grossa:</strong> transformação em T alta (perto de 727 °C); <strong>perlita fina:</strong> T menor.\n<strong>Bainita:</strong> abaixo do “nariz” da curva.\n<strong>Martensita:</strong> resfriamento <strong>rápido</strong> que evita o nariz (têmpera)."},
  {t:"c", p:2, term:"Martensita — como se forma e como é?",
   ans:"Transformação <strong>SEM difusão</strong> (adifusional, quase instantânea; depende só da temperatura — linhas Ms/Mf). Estrutura <strong>tetragonal</strong> supersaturada de C. Muito <strong>dura e frágil</strong> → exige <strong>revenimento</strong>."},

  // ================= BLOCO P3 — TRATAMENTOS TÉRMICOS, LIGAS E FABRICAÇÃO =================
  // ---------- CONCEITOS P3 ----------
  {t:"c", p:3, term:"Têmpera — o que faz?",
   ans:"Resfriamento <strong>rápido</strong> do aço → forma <strong>martensita</strong>. Aumenta muito a <strong>dureza</strong> e a resistência, mas deixa o material <strong>frágil</strong>. Quase sempre seguida de revenimento."},
  {t:"c", p:3, term:"Revenimento — objetivo (após a têmpera)",
   ans:"<strong>Reduz a fragilidade</strong> da martensita e <strong>aumenta a tenacidade</strong>, com pequena perda de dureza. Alivia tensões internas geradas na têmpera."},
  {t:"c", p:3, term:"Recozimento — para que serve?",
   ans:"<strong>Amolece</strong> o aço: aumenta a <strong>ductilidade</strong>, alivia tensões e <strong>melhora a usinabilidade</strong>. É o tratamento indicado <strong>antes de usinar</strong> uma peça."},
  {t:"c", p:3, term:"Normalização",
   ans:"Aquecimento seguido de resfriamento <strong>ao ar</strong>. <strong>Refina o grão</strong> e homogeneíza a microestrutura. Propriedades intermediárias entre recozido e temperado."},
  {t:"c", p:3, term:"Cementação — o que muda na superfície?",
   ans:"<strong>Aumenta</strong> o teor de <strong>carbono</strong> na superfície (difusão de C). Depois da têmpera → superfície <strong>dura</strong> com núcleo tenaz. ⚠️ Ela AUMENTA o carbono, nunca reduz."},
  {t:"c", p:3, term:"Nitretação",
   ans:"Enriquece a superfície com <strong>nitrogênio</strong> → alta dureza superficial e resistência ao desgaste, feita em <strong>baixa temperatura</strong> (pouca distorção da peça)."},
  {t:"c", p:3, term:"Eixo: superfície dura + núcleo tenaz — como?",
   ans:"<strong>Cementação (ou nitretação) + têmpera + revenimento.</strong> A superfície fica resistente ao desgaste e o núcleo continua tenaz para absorver impacto."},
  {t:"c", p:3, term:"Material para cabos de energia elétrica",
   ans:"<strong>Cobre.</strong> Reúne elevada <strong>condutividade elétrica</strong>, boa <strong>ductilidade</strong> e fácil conformação (trefilado em fios)."},
  {t:"c", p:3, term:"Ligas de alumínio — propriedades-chave",

const $ = s => document.querySelector(s);
const card=$("#card"), front=$("#front"), back=$("#back"), empty=$("#empty");
let order = CARDS.map((_,i)=>i);
let deck="all", pdeck="all", hideKnown=false, cursor=0, flipped=false;
const known = new Set();

function deckMatch(id){
  const c = CARDS[id];
  return (deck==="all" || c.t===deck) && (pdeck==="all" || String(c.p)===pdeck);
}
function visible(){ return order.filter(id => deckMatch(id) && (!hideKnown || !known.has(id))); }

function renderFront(c){
  if(c.t==="c"){
    return '<div class="tag"><span class="lbl">Conceito</span><span class="side">bloco P'+c.p+'</span></div>'+
           '<div class="term">'+c.term+'</div>'+
           '<div class="hint">↺ toque para ver a resposta</div>';
  }
  const opts = c.opts.map(o=>'<li><span class="k">'+o[0]+'</span><span>'+o[1]+'</span></li>').join("");
  return '<div class="tag"><span class="lbl">Questão '+c.n+'</span><span class="side">bloco P'+c.p+'</span></div>'+
         '<div class="stem">'+c.stem+'</div>'+
         '<ul class="opts">'+opts+'</ul>'+
         '<div class="hint">↺ toque para o gabarito</div>';
}
function renderBack(c){
  if(c.t==="c"){
    return '<div class="tag"><span class="lbl">Resposta</span><span class="side">bloco P'+c.p+'</span></div>'+
           '<div class="answer">'+c.ans.replace(/\n/g,"<br>")+'</div>';
  }
  return '<div class="tag"><span class="lbl">Gabarito · Q'+c.n+'</span><span class="side">bloco P'+c.p+'</span></div>'+
         '<div class="gab"><span class="letter">'+c.a+'</span><span class="txt">'+c.at+'</span></div>'+
         '<div class="explain">'+c.ex+'</div>';
}

function render(){
  const vis = visible();
  const total = vis.length;
  document.querySelector(".stage").hidden = false;
  if(total===0){
    card.style.display="none"; empty.hidden=false;
  }else{
    card.style.display=""; empty.hidden=true;
    if(cursor>=total) cursor=total-1;
    if(cursor<0) cursor=0;
    const id = vis[cursor], c = CARDS[id];
    card.classList.remove("flip"); flipped=false;
    card.classList.toggle("c", c.t==="c");
    card.classList.toggle("q", c.t==="q");
    card.classList.toggle("known", known.has(id));
    front.innerHTML = renderFront(c);
    back.innerHTML = renderBack(c);
    card.dataset.id = id;
  }
  // meters
  $("#pos").textContent = total? (cursor+1):0;
  $("#total").textContent = total;
  $("#progfill").style.width = total? (((cursor+1)/total)*100+"%") : "0%";
  const deckIds = order.filter(deckMatch);
  const dk = deckIds.filter(id=>known.has(id)).length;
  $("#dom").textContent = "dominadas "+dk+"/"+deckIds.length;
  $("#know").classList.toggle("on", total && known.has(vis[cursor]));
  $("#hide").classList.toggle("on", hideKnown);
}

function flip(){ if(card.style.display==="none")return; flipped=!flipped; card.classList.toggle("flip",flipped); }
function go(d){ const t=visible().length; if(!t)return; cursor=(cursor+d+t)%t; render(); }
function markKnown(){
  const vis=visible(); if(!vis.length)return;
  const id=vis[cursor];
  if(known.has(id)) known.delete(id); else known.add(id);
  render();
}
// deterministic-ish shuffle (no Math.random dependency issues)
function shuffle(){
  let seed = (Date.now?Date.now():order.length*97) ^ (cursor*2654435761);
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  cursor=0; render();
}

// events
document.querySelectorAll(".chip[data-deck]").forEach(ch=>ch.addEventListener("click",()=>{
  document.querySelectorAll(".chip[data-deck]").forEach(x=>x.setAttribute("aria-pressed","false"));
  ch.setAttribute("aria-pressed","true");
  deck=ch.dataset.deck; cursor=0; render();
}));
document.querySelectorAll(".chip[data-pdeck]").forEach(ch=>ch.addEventListener("click",()=>{
  document.querySelectorAll(".chip[data-pdeck]").forEach(x=>x.setAttribute("aria-pressed","false"));
  ch.setAttribute("aria-pressed","true");
  pdeck=ch.dataset.pdeck; cursor=0; render();
}));
card.addEventListener("click", flip);
$("#flip").addEventListener("click", flip);
$("#prev").addEventListener("click", ()=>go(-1));
$("#next").addEventListener("click", ()=>go(1));
$("#know").addEventListener("click", markKnown);
$("#hide").addEventListener("click", ()=>{ hideKnown=!hideKnown; cursor=0; render(); });
$("#shuffle").addEventListener("click", shuffle);
$("#reset").addEventListener("click", ()=>{ known.clear(); hideKnown=false; deck="all"; pdeck="all";
  document.querySelectorAll(".chip[data-deck]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.deck==="all"?"true":"false"));
  document.querySelectorAll(".chip[data-pdeck]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.pdeck==="all"?"true":"false"));
  order=CARDS.map((_,i)=>i); cursor=0; render(); });

document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"");
  if(e.key==="ArrowRight"){ go(1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"){ go(-1); e.preventDefault(); }
  else if(e.key===" "||e.key==="Enter"){ if(tag==="BUTTON")return; flip(); e.preventDefault(); }
  else if(e.key==="k"||e.key==="K"){ markKnown(); }
  else if(e.key==="s"||e.key==="S"){ shuffle(); }
});

render();
</script>
